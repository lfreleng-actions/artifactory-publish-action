---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: "Test local GitHub Action"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10 # Increase this timeout value as needed
    steps:
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@65ff87957e1cac2de3203a85dbb07c31810321cb  # v0.16.4
        with:
          config: '@56d70f0eae78f334a598d1ffe071d4b821517b22'  # v0.17.1

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}
            releases.jfrog.io:443
            releases-cdn.jfrog.io:443

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run publish.sh self-test"
        shell: bash
        run: bash tests/test_publish.sh

      # Same CLI version as action.yaml; no server, no credentials
      - name: "Install JFrog CLI"
        # yamllint disable-line rule:line-length
        uses: jfrog/setup-jfrog-cli@4c2f06da03095113100534a16d58d8a252680949  # v5.3.5
        with:
          version: '2.133.0'
          disable-job-summary: 'true'
          disable-auto-build-publish: 'true'
          disable-auto-evidence-collection: 'true'

      - name: "Run publish.sh against the real CLI and a loopback server"
        shell: bash
        run: bash tests/test_cli.sh

      - name: "Create test m2repo"
        shell: bash
        run: |
          # Create test m2repo
          d=m2repo/org/example/app/1.0.0
          mkdir -p "$d"
          touch "$d/app-1.0.0.jar" "$d/app-1.0.0.pom" "$d/app-1.0.0.jar.sha1"

      - name: "Running local action: dry run"
        id: dry-run
        uses: $/
        with:
          artifactory_url: "https://example.jfrog.io"
          repository_name: "libs-release-local"
          files_path: "m2repo"
          dry_run: "true"

      - name: "Validate dry run count"
        shell: bash
        env:
          COUNT: ${{ steps.dry-run.outputs.dry_run_count }}
        run: |
          # Validate dry run count
          if [ "$COUNT" != "2" ]; then
            echo "Error: expected dry_run_count 2, got '$COUNT' ❌"
            exit 1
          fi

      - name: "Running local action: live run without token [Failure]"
        id: failure
        uses: $/
        continue-on-error: true
        with:
          artifactory_url: "https://example.jfrog.io"
          repository_name: "libs-release-local"
          files_path: "m2repo"

      - name: "Error if step above did NOT fail"
        if: steps.failure.outcome == 'success'
        shell: bash
        run: |
          # Error if step above did NOT fail
          echo "Error: previous test step did NOT fail ❌"
          exit 1

      # The caller's own CLI server and JF_* credentials must survive
      # the action untouched, and must not break its CLI setup
      - name: "Configure a caller CLI server"
        shell: bash
        run: |
          # Configure a caller CLI server
          jf config add caller --url=https://caller.example.invalid \
            --access-token=caller-placeholder --interactive=false

      - name: "Running local action: caller JF_* credentials [Failure]"
        id: caller-env
        uses: $/
        continue-on-error: true
        env:
          JF_URL: "https://caller.example.invalid"
          JF_USER: "caller"
          JF_ACCESS_TOKEN: "caller-placeholder"
        with:
          # A closed loopback port: the upload fails after setup
          artifactory_url: "https://127.0.0.1:1"
          access_token: "placeholder"
          repository_name: "libs-release-local"
          files_path: "m2repo"

      - name: "Validate the caller's CLI configuration"
        shell: bash
        env:
          FAILED: ${{ steps.caller-env.outputs.failed_count }}
        run: |
          # Validate the caller's CLI configuration
          # failed_count comes from publish.sh, so setup succeeded
          if [ "$FAILED" != "2" ]; then
            echo "Error: expected failed_count 2, got '$FAILED' ❌"
            exit 1
          fi
          ids="$(jf config show | sed -n 's/^Server ID:[[:space:]]*//p')"
          if [ "$ids" != "caller" ]; then
            echo "Error: caller servers changed: ${ids//$'\n'/, } ❌"
            exit 1
          fi

  ### macOS system Bash 3.2 and BSD utilities ###
  portability:
    name: "Test publish.sh with macOS /bin/bash"
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Harden-runner supports Linux runners only
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run publish.sh self-test"
        run: /bin/bash tests/test_publish.sh

  ### Live upload; opt in by setting the ARTIFACTORY_URL variable ###
  integration:
    name: "Live upload to Artifactory"
    # Fork and Dependabot PRs get no environment secret; skip them
    if: >-
      vars.ARTIFACTORY_URL != '' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    # Scopes the token to a dedicated environment
    environment: integration-auto
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      REPO_KEY: ${{ vars.ARTIFACTORY_REPOSITORY }}
      GROUP_PATH: "org/lfreleng/test/artifactory-publish-action"
      VERSION: "0.0.${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      # Audit only: the Artifactory host is per-repository configuration
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: 'audit'

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Create test m2repo"
        shell: bash
        run: |
          # Create test m2repo with a unique version per run
          d="m2repo/${GROUP_PATH}/${VERSION}"
          mkdir -p "$d"
          echo "jar" > "$d/artifactory-publish-action-${VERSION}.jar"
          # Artifactory parses POMs on upload; it must be valid XML
          cat > "$d/artifactory-publish-action-${VERSION}.pom" <<EOF
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>org.lfreleng.test</groupId>
            <artifactId>artifactory-publish-action</artifactId>
            <version>${VERSION}</version>
          </project>
          EOF
          sha1sum "$d/artifactory-publish-action-${VERSION}.jar" \
            > "$d/artifactory-publish-action-${VERSION}.jar.sha1"

      - name: "Running local action: live upload"
        id: live
        uses: $/
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}
          access_token: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          repository_name: ${{ vars.ARTIFACTORY_REPOSITORY }}
          files_path: "m2repo"

      # The action leaves no CLI configuration behind; the checks below
      # need their own, with the token on stdin rather than in argv
      - name: "Configure JFrog CLI for checks"
        if: always() && steps.live.outcome != 'skipped'
        shell: bash
        env:
          ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
          ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          # Configure JFrog CLI for checks
          printf '%s' "$ACCESS_TOKEN" | jf config add checks \
            --url="$ARTIFACTORY_URL" --access-token-stdin --interactive=false

      - name: "Validate upload"
        shell: bash
        env:
          COUNT: ${{ steps.live.outputs.publication_count }}
          PUBLISHED: ${{ steps.live.outputs.published_files }}
        run: |
          # Validate upload count and presence in the repository
          set -euo pipefail
          listed=$(jq length <<< "$PUBLISHED")
          if [ "$COUNT" != "2" ] || [ "$listed" != "2" ]; then
            echo "Error: expected 2 uploads, got '$COUNT'/'$listed' ❌"
            exit 1
          fi
          found=$(jf rt search --server-id=checks --count \
            "${REPO_KEY}/${GROUP_PATH}/${VERSION}/*")
          if [ "$found" != "2" ]; then
            echo "Error: expected 2 artifacts in ${REPO_KEY}, got '$found' ❌"
            exit 1
          fi
          echo "Uploaded and found ${found} artifacts ✅"

      - name: "Remove test artifacts"
        if: always() && steps.live.outcome != 'skipped'
        shell: bash
        run: |
          # Remove test artifacts
          # Needs DELETE on the repo; warn rather than fail the test
          target="${REPO_KEY}/${GROUP_PATH}/${VERSION}/"
          if ! jf rt delete --server-id=checks --quiet "$target"; then
            echo "::warning::Cleanup failed; remove ${target} manually"
          fi
