---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# artifactory-publish-action
name: '🐸 Artifactory Publishing'
description: 'Uploads a Maven repository tree (m2repo) to JFrog Artifactory'
# Artifactory has no Nexus-style staging (close/rules/drop): upload
# straight to the target repository; promotion, if wanted, is a copy

inputs:
  # Mandatory
  artifactory_url:
    description: 'JFrog platform URL (e.g. https://example.jfrog.io)'
    required: true
  repository_name:
    # Same name as nexus-publish-action, for a drop-in replacement
    description: 'Target repository key (e.g. libs-release-local)'
    required: true
  files_path:
    description: 'Directory holding the Maven layout to upload (m2repo)'
    required: true
  # Optional
  access_token:
    # Checked at runtime: required unless dry_run is true
    description: 'Artifactory access token; required unless dry_run is true'
    required: false
  upload_path:
    description: 'Path prefix within the repository; default is the root'
    required: false
    default: ''
  dry_run:
    # Only true or false (any case); anything else fails before upload
    description: 'List what would upload, without any network requests'
    required: false
    default: 'false'

outputs:
  publication_count:
    description: 'Number of files uploaded'
    value: "${{ steps.publish.outputs.publication_count }}"
  failed_count:
    description: 'Number of files that failed to upload'
    value: "${{ steps.publish.outputs.failed_count }}"
  dry_run_count:
    description: 'Number of files a dry run would upload (0 otherwise)'
    value: "${{ steps.publish.outputs.dry_run_count }}"
  published_files:
    description: 'JSON array of repository paths uploaded (live run)'
    value: "${{ steps.publish.outputs.published_files }}"
  failed_files:
    description: 'JSON array of repository paths not uploaded (live run)'
    value: "${{ steps.publish.outputs.failed_files }}"

runs:
  using: 'composite'
  steps:
    - name: 'Validate inputs'
      id: validate
      shell: bash
      env:
        ARTIFACTORY_URL: "${{ inputs.artifactory_url }}"
        ACCESS_TOKEN: "${{ inputs.access_token }}"
        REPOSITORY_NAME: "${{ inputs.repository_name }}"
        FILES_PATH: "${{ inputs.files_path }}"
        UPLOAD_PATH: "${{ inputs.upload_path }}"
        DRY_RUN: "${{ inputs.dry_run }}"
      run: |
        # Validate inputs
        "$GITHUB_ACTION_PATH/scripts/publish.sh" validate

    - name: 'Setup JFrog CLI'
      if: steps.validate.outputs.dry_run == 'false'
      # yamllint disable-line rule:line-length
      uses: jfrog/setup-jfrog-cli@4c2f06da03095113100534a16d58d8a252680949  # v5.3.5
      # Installs the CLI only: publish.sh configures its own private
      # server entry, so no credentials here and no default changes
      # It reads JF_URL, JF_USER, JF_PASSWORD, JF_ACCESS_TOKEN and any
      # JF_ENV_* from the job: blank the first four, so it neither adds
      # a server nor fails on the caller's credentials, and point its
      # CLI home at a throwaway directory, where JF_ENV_* imports land
      env:
        JF_URL: ''
        JF_USER: ''
        JF_PASSWORD: ''
        JF_ACCESS_TOKEN: ''
        JFROG_CLI_HOME_DIR: "${{ runner.temp }}/jf-setup-home"
      with:
        version: '2.133.0'
        # Its post step otherwise runs 'jf c rm' on every server ID in
        # JFROG_CLI_SERVER_IDS, including ones the caller configured;
        # with an ID nothing uses, it removes nothing and exits 0
        custom-server-id: 'artifactory-publish-action'
        # ponytail: plain upload, no build-info; these post steps need
        # platform permissions a project-scoped token lacks
        disable-auto-build-publish: 'true'
        disable-auto-evidence-collection: 'true'
        # The upload writes no JFrog command summary to the caller's job
        disable-job-summary: 'true'

    - name: 'Publish to Artifactory'
      id: publish
      shell: bash
      env:
        ARTIFACTORY_URL: "${{ inputs.artifactory_url }}"
        ACCESS_TOKEN: "${{ inputs.access_token }}"
        REPOSITORY_NAME: "${{ inputs.repository_name }}"
        FILES_PATH: "${{ inputs.files_path }}"
        UPLOAD_PATH: "${{ inputs.upload_path }}"
        DRY_RUN: "${{ inputs.dry_run }}"
      run: |
        # Publish to Artifactory
        "$GITHUB_ACTION_PATH/scripts/publish.sh" publish
